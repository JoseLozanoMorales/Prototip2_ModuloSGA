<!-- Modal Generico de PDF — Bootstrap 3 + FontAwesome 4 -->

<div class="modal-dialog">
    <div class="modal-content">

        <div class="modal-header" style="display: block">
            <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                <span aria-hidden="true">&times;</span>
            </button>
            <h4 class="modal-title">
                <i id="modalPdfIcono" class="fa fa-file-pdf-o" style="color:#dc2626; margin-right:6px;"></i>
                <span id="modalPdfTitulo">Vista previa del documento</span>
            </h4>
        </div>

        <div class="modal-body" style="padding: 8px;">
            {% include "plantillas/pdf_viewer.html" with viewer_id="pdfViewerModal" %}
        </div>

    </div>
</div>
