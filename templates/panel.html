{% extends "basebs.html" %}
{% block canvas %}
    <div class="row-fluid">
        <div class="span12">
            <div class="well">
                <h2>{{ nombresistema|default:"Django Project Base" }}</h2>
                <p>Bienvenido{% if request.user.is_authenticated %}, {{ request.user }}{% endif %}.</p>
            </div>
        </div>
    </div>
    <div class="row-fluid">
        <div class="span4">
            <div class="well" style="text-align: center;">
                <i class="fa fa-users" style="font-size: 40px;"></i>
                <h4>Personas</h4>
                <p>Administra el listado de personas registradas.</p>
                <a href="{% url 'persona_list' %}" class="btn btn-primary">Ir al listado</a>
            </div>
        </div>
    </div>
{% endblock %}
